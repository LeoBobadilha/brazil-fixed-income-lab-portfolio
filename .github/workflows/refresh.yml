name: Scheduled data refresh

# Rebuilds datasets from official sources on business days. A failed or
# suspicious refresh never replaces the last validated snapshot: the pipeline
# exits non-zero on blocking checks and nothing is committed.
#
# Data path: refresh -> commit (only if the snapshot changed) -> full test suite on
# the new commit -> deploy that exact commit via deploy.yml. An unchanged snapshot
# commits nothing and deploys nothing. The commit is pushed with GITHUB_TOKEN, which
# does not trigger ci.yml, so the data commit is deployed exactly once.
on:
  schedule:
    - cron: "30 11 * * 1-5"  # 08:30 BRT, after Tesouro Transparente's daily update
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only the operational repository refreshes and deploys data.
    if: github.repository == 'LeoBobadilha/brazil-fixed-income-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Restore raw-data cache (incremental SGS/Focus, last good raw files)
        uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Run pipeline (download, validate, price, reconcile, publish)
        env: { BFIL_DISABLE_TRUSTSTORE: "1" }
        run: python -m src.pipeline
      - name: Tests on the new snapshot
        run: python -m pytest
      - name: Commit only if the snapshot content changed
        id: commit
        run: |
          python - <<'PY'
          import json, os
          r = json.load(open("reports/last_run.json"))
          print(json.dumps({k: r.get(k) for k in ("data_as_of", "snapshot_id", "changed", "status")}))
          PY
          if git status --porcelain web/public/data | grep -q . && grep -q '"changed": true' reports/last_run.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/public/data
            DATA_AS_OF=$(python -c "import json; print(json.load(open('reports/last_run.json'))['data_as_of'])")
            git commit -m "data: refresh snapshot (data as of ${DATA_AS_OF})"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot unchanged; nothing committed and nothing deployed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: refresh-report, path: reports/, retention-days: 14 }

  tests:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true' && needs.refresh.outputs.sha != ''
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}

  pages:
    name: Deploy refreshed snapshot
    needs: [refresh, tests]
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
      trigger: data
