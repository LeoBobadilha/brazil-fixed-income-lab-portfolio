name: Tests

# Reusable test suite. It checks out the exact commit it is given, so a deployment can
# prove that the commit it publishes is the commit that was tested. JUnit reports are
# uploaded as artifacts of the calling run and reused by deploy.yml (no second test run).
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    name: Python tests and public-data audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}", fetch-depth: 0 }  # full history for the security audit
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Pricing, ETL, reconciliation, privacy and English-only tests
        run: python -m pytest --junitxml=reports/pytest.xml
      - name: Security audit (all git history and published data)
        run: python scripts/security_audit.py
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: pytest-junit, path: reports/pytest.xml, retention-days: 14 }

  web:
    name: Web build, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Unit tests (engine parity with Python, Q&A scoping, UI logic)
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - run: npx playwright install --with-deps chromium
      - name: Browser regression and accessibility (desktop + mobile)
        run: npx playwright test
        env: { CI: "true" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-test-results
          retention-days: 14
          path: |
            web/test-results
            web/reports
